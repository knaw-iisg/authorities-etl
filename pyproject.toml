[project]
name = "authorities-etl"
version = "0.1.0"
description = "IISG authority-file ETL: MARC/OAI-PMH -> RDF"
requires-python = ">=3.10"
dependencies = [
    "rdflib>=7.0",
    "requests>=2.31",
    "xmltodict>=0.13",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["authorities_etl*"]
